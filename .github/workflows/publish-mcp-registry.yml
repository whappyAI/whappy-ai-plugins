name: Publish to the MCP Registry

# Publishes server.json as ai.whappy/whappy, proving the ai.whappy namespace
# with the DNS TXT record on whappy.ai.
# Docs: https://modelcontextprotocol.io/registry/github-actions.md
#       https://modelcontextprotocol.io/registry/authentication.md
#
# Before the first run:
# 1. The whappy.ai apex has the TXT record from README.md ("MCP Registry").
# 2. The Ed25519 private key (hex) is stored as the secret MCP_PRIVATE_KEY on
#    the environment "mcp-registry-publish", restricted to v* tags, with a
#    required reviewer. Never as a plain repository secret.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mcp-registry-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: mcp-registry-publish
    env:
      MCP_PUBLISHER_VERSION: v1.8.12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The tag matches server.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(jq -r .version server.json)"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match server.json version $version" >&2
            exit 1
          fi

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install mcp-publisher (signature verified)
        run: scripts/install-mcp-publisher.sh

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Authenticate with DNS (whappy.ai)
        env:
          MCP_PRIVATE_KEY: ${{ secrets.MCP_PRIVATE_KEY }}
        run: ./mcp-publisher login dns --domain whappy.ai --private-key "$MCP_PRIVATE_KEY"

      - name: Publish
        run: ./mcp-publisher publish server.json

      - name: Log out
        if: always()
        run: ./mcp-publisher logout || true
